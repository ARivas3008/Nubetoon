name: Publicar NubeToon en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nubetoon-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar sitio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar los archivos publicos
        run: |
          mkdir -p _site
          cp index.html catalogo.html detalle.html reproductor.html mi-lista.html blog.html articulo.html _site/
          cp -R assets styles scripts data _site/
          touch _site/.nojekyll

      - name: Subir archivos del sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Desplegar sitio
        id: deployment
        uses: actions/deploy-pages@v4
